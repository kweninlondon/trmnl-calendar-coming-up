- keyname: event_limit
  field_type: number
  name: Maximum events
  description: Show up to this many upcoming events. Smaller screens may display fewer.
  min: 1
  max: 15
  step: 1
  default: 10
- keyname: group_events
  field_type: boolean
  name: Group by Today, This week, Next week and Later
  default: true
- keyname: time_zone
  field_type: time_zone
  name: Display timezone
  description: Used for event times and Monday-to-Sunday week boundaries.
  default: Europe/London
- keyname: title_override
  field_type: string
  name: Custom title
  optional: true
  maxlength: 150
  group: Title and footer
  description: Leave blank for Coming Up.
  help_text: 'Optional placeholders: {count}, {limit}, {calendars}, {calendar_count}, {description}.'
- keyname: footer_override
  field_type: string
  name: Custom footer
  optional: true
  maxlength: 150
  group: Title and footer
  description: Leave blank for the description or event count.
  placeholder: 'Next {count} events from {calendar_count} calendars'
  help_text: 'Optional placeholders: {count}, {limit}, {calendars}, {calendar_count}, {description}.'
