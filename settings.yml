- keyname: event_limit
  field_type: number
  name: Maximum events
  description: Show up to this many upcoming events. Smaller screens may display fewer.
  min: 1
  max: 15
  step: 1
  default: 10
- keyname: group_events
  field_type: boolean
  name: Group by Today, This week, Next week and Later
  default: true
- keyname: time_zone
  field_type: time_zone
  name: Display timezone
  description: Used for event times and Monday-to-Sunday week boundaries.
  default: Europe/London
- keyname: title_override
  field_type: string
  name: Custom title
  optional: true
  maxlength: 150
  group: Title and footer
  description: Leave blank for Coming Up in the calendar name, or Coming Up for multiple calendars.
  help_text: '{count} reports events visible on the screen. Optional placeholders: {count}, {limit}, {calendars}, {calendar_count}, {description}.'
- keyname: footer_override
  field_type: string
  name: Custom footer
  optional: true
  maxlength: 150
  group: Title and footer
  description: Leave blank for the description or event count.
  placeholder: '{count} events coming up'
  help_text: '{count} reports events visible on the screen. Optional placeholders: {count}, {limit}, {calendars}, {calendar_count}, {description}.'

- keyname: about_coming_up
  name: About Coming Up
  field_type: author_bio
  category: calendar,productivity
  github_url: https://github.com/kweninlondon/trmnl-calendar-coming-up
  learn_more_url: https://github.com/kweninlondon/trmnl-calendar-coming-up#readme
  description: >-
    Coming Up displays your next calendar events, however far ahead they are.
    Combine up to five ICS calendars into one chronological agenda, with a maximum
    of 15 events. The layout shows as many events as fit on your screen.<br><br>
    Optionally group events into Today, This week, Next week and Later, using
    Monday-to-Sunday weeks. A single calendar uses its name in the default title;
    multiple calendars display a label alongside each event. Customise the title
    and footer with calendar names and automatic visible event counts.<br><br>
    Includes full screen, half vertical, two-column half horizontal and quadrant
    layouts. Just enter your ICS links; no additional calendar scripts or hosting
    accounts are required.<br><br>
    Created by Quentin Vien. For setup instructions, source code or support,
    visit the GitHub repository and open an issue.
