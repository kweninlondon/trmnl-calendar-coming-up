- keyname: ics_1
  field_type: string
  name: Calendar 1 ICS link
  description: Paste the calendar feed link, not its browser viewing link.
  group: Calendars
  optional: false

- keyname: ics_2
  field_type: string
  name: Calendar 2 ICS link
  description: Paste the calendar feed link, not its browser viewing link.
  group: Calendars
  optional: true

- keyname: ics_3
  field_type: string
  name: Calendar 3 ICS link
  description: Paste the calendar feed link, not its browser viewing link.
  group: Calendars
  optional: true

- keyname: ics_4
  field_type: string
  name: Calendar 4 ICS link
  description: Paste the calendar feed link, not its browser viewing link.
  group: Calendars
